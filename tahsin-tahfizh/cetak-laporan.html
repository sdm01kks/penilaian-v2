<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cetak Laporan — Tahsin-Tahfizh | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .app-header-title-wrap{flex:1;min-width:0}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  #reportOutput{display:none}
  .progress-note{text-align:center;font-size:12.5px;color:var(--ink-muted);font-weight:600;padding:20px}
</style>
</head>
<body>

<div class="phone-viewport no-print">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title">Cetak Laporan</div>
            <button class="app-header-sub-btn" id="guruLabel" title="Ketuk untuk keluar">
              <span id="guruLabelText">Memuat…</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </div>
          <a href="../index.html" class="app-header-back" style="text-decoration:none" aria-label="Ke Halaman Utama" title="Ke Halaman Utama">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          </a>
        </div>
      </div>

      <div class="app-body" id="appBody">

        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data masih tiruan.</span>
        </div>

        <div class="section-label" style="margin-top:0"><span class="bar"></span>Cakupan Laporan</div>
        <div class="card">
          <div class="pill-toggle" id="modeToggle" style="margin-bottom:0">
            <button type="button" data-mode="kelas" class="active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Satu Kelas
            </button>
            <button type="button" data-mode="siswa">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a6 6 0 0 1 12 0v2"/></svg>
              Satu Siswa
            </button>
          </div>
        </div>

        <div id="pilihKelasBlock">
          <div class="section-label">Kelas</div>
          <div class="card">
            <div class="kelas-chip-row" id="kelasChipRow"></div>
            <div id="kelasHint" class="siswa-empty-note">Pilih satu kelas untuk dicetak laporannya.</div>
          </div>
        </div>

        <div id="pilihSiswaBlock" class="hidden">
          <div class="section-label">Siswa</div>
          <div class="card">
            <div id="siswaTerpilihBlock" class="hidden">
              <div class="siswa-selected">
                <div class="avatar-circle" id="siswaTerpilihAvatar">--</div>
                <div class="info">
                  <div class="nama" id="siswaTerpilihNama">-</div>
                  <div class="meta" id="siswaTerpilihMeta">-</div>
                </div>
                <button class="btn-ganti" id="btnGantiSiswaCetak" aria-label="Ganti siswa">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4M7 4 3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
                </button>
              </div>
            </div>
            <div id="siswaPickerBlockCetak">
              <div class="search-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="siswaSearchCetak" placeholder="Cari nama atau NIS siswa…" autocomplete="off">
              </div>
              <div class="kelas-chip-row" id="kelasChipRowCetak"></div>
              <div class="siswa-result-list" id="siswaResultListCetak"></div>
            </div>
          </div>
        </div>

        <div class="section-label">Periode Laporan</div>
        <div class="card">
          <div class="date-row">
            <div>
              <div class="field-label">Tanggal Mulai</div>
              <input type="date" class="select-field" id="tglMulai">
            </div>
            <div>
              <div class="field-label">Tanggal Akhir</div>
              <input type="date" class="select-field" id="tglAkhir">
            </div>
          </div>
          <div class="field-label">Label Semester (tampil di laporan)</div>
          <input type="text" class="select-field" id="labelSemester" placeholder="mis. Semester Ganjil 2026/2027" style="text-align:left">
        </div>

        <div class="section-label">&nbsp;</div>
        <button class="btn btn-primary-light" id="btnBuat">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
          <span id="btnBuatLabel">Buat &amp; Cetak Laporan Kelas</span>
        </button>

        <div id="progressArea"></div>

      </div>

    </div>
  </div>
</div>

<div id="reportOutput"></div>

<div class="toast" id="toast">
  <svg class="dot-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange, logout } from '../assets/firebase.js';
  import { getSiswaList, getRiwayatSetoran, getMenulisLog, getTargetHafalan, hitungProgresSurah } from '../assets/firestore-data.js';
  import { surahByNo } from '../assets/quran-surah.js';

  const $ = (id) => document.getElementById(id);

  let currentUser = null;
  onAuthChange((session) => {
    if (!session) { window.location.href = 'login.html'; return; }
    currentUser = session;
    $('guruLabelText').textContent = session.nama;
    loadKelas();
  });

  if (DEMO_MODE) $('demoStrip').classList.remove('hidden');

  $('guruLabel').addEventListener('click', async () => {
    if (!confirm('Keluar dari akun ini?')) return;
    try {
      await logout();
    } catch (err) {
      console.error(err);
    }
    window.location.href = 'login.html';
  });


  $('btnBack').addEventListener('click', () => { window.location.href = 'riwayat-siswa.html'; });

  function showToast(msg, isError = false) {
    $('toastMsg').textContent = msg;
    const t = $('toast');
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // Default periode: 6 bulan terakhir s/d hari ini
  const today = new Date();
  const sixMonthsAgo = new Date(today); sixMonthsAgo.setMonth(today.getMonth() - 6);
  $('tglAkhir').valueAsDate = today;
  $('tglMulai').valueAsDate = sixMonthsAgo;

  /* ---- Mode: Per Kelas vs Per Siswa ---- */
  let mode = 'kelas';
  $('modeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    mode = btn.dataset.mode;
    $('modeToggle').querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    $('pilihKelasBlock').classList.toggle('hidden', mode !== 'kelas');
    $('pilihSiswaBlock').classList.toggle('hidden', mode !== 'siswa');
    $('btnBuatLabel').textContent = mode === 'kelas' ? 'Buat & Cetak Laporan Kelas' : 'Buat & Cetak Laporan Siswa';
  });

  /* ---- Pilih kelas (mode: Per Kelas) ---- */
  let siswaCache = [];
  let kelasTerpilih = null;

  async function loadKelas() {
    siswaCache = await getSiswaList(undefined, currentUser);
    const kelasList = [...new Set(siswaCache.map(s => s.kelas))].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
    $('kelasChipRow').innerHTML = kelasList.map(k => `<button type="button" class="kelas-chip" data-kelas="${k}">${k}</button>`).join('');
    $('kelasChipRow').querySelectorAll('.kelas-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        kelasTerpilih = chip.dataset.kelas;
        $('kelasChipRow').querySelectorAll('.kelas-chip').forEach(c => c.classList.toggle('active', c === chip));
        const jumlah = siswaCache.filter(s => s.kelas === kelasTerpilih).length;
        $('kelasHint').textContent = `Kelas ${kelasTerpilih} — ${jumlah} siswa akan dicetak.`;
      });
    });

    setupSiswaPickerCetak();
    handleUrlPreselect();
  }

  /* ---- Pilih siswa individual (mode: Per Siswa) ---- */
  let siswaTerpilihCetak = null;
  let kelasFilterCetak = null;

  function initialsCetak(nama) {
    return nama.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  function setupSiswaPickerCetak() {
    const kelasList = [...new Set(siswaCache.map(s => s.kelas))].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
    $('kelasChipRowCetak').innerHTML = kelasList.map(k => `<button type="button" class="kelas-chip" data-kelas="${k}">${k}</button>`).join('');
    $('kelasChipRowCetak').querySelectorAll('.kelas-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        kelasFilterCetak = (kelasFilterCetak === chip.dataset.kelas) ? null : chip.dataset.kelas;
        $('siswaSearchCetak').value = '';
        $('kelasChipRowCetak').querySelectorAll('.kelas-chip').forEach(c => c.classList.toggle('active', c.dataset.kelas === kelasFilterCetak));
        renderSiswaResultsCetak();
      });
    });
    renderSiswaResultsCetak();
  }

  function renderSiswaResultsCetak() {
    const wrap = $('siswaResultListCetak');
    const q = $('siswaSearchCetak').value.trim().toLowerCase();
    let scoped = kelasFilterCetak ? siswaCache.filter(s => s.kelas === kelasFilterCetak) : siswaCache;
    if (q) scoped = scoped.filter(s => s.nama.toLowerCase().includes(q) || s.nis.includes(q));

    if (!kelasFilterCetak && !q) {
      wrap.innerHTML = `<div class="siswa-empty-note">Pilih kelas di atas, atau ketik nama/NIS untuk mencari langsung.</div>`;
      return;
    }
    if (!scoped.length) {
      wrap.innerHTML = `<div class="siswa-empty-note">Siswa tidak ditemukan.</div>`;
      return;
    }
    const itemHtml = (s) => `
      <div class="siswa-result-item" data-id="${s.id}">
        <div class="avatar-circle">${initialsCetak(s.nama)}</div>
        <div>
          <div class="nama">${s.nama}</div>
          <div class="meta">${s.nis} • Kelas ${s.kelas}</div>
        </div>
      </div>
    `;
    if (!kelasFilterCetak && q) {
      const byKelas = {};
      scoped.forEach(s => { (byKelas[s.kelas] ||= []).push(s); });
      wrap.innerHTML = Object.keys(byKelas).sort((a, b) => a.localeCompare(b, 'id', { numeric: true })).map(k => `
        <div class="siswa-group-label">Kelas ${k}</div>
        ${byKelas[k].map(itemHtml).join('')}
      `).join('');
    } else {
      wrap.innerHTML = scoped.map(itemHtml).join('');
    }
    wrap.querySelectorAll('.siswa-result-item').forEach(el => el.addEventListener('click', () => selectSiswaCetak(el.dataset.id)));
  }

  $('siswaSearchCetak').addEventListener('input', () => renderSiswaResultsCetak());

  function selectSiswaCetak(id) {
    const s = siswaCache.find(x => x.id === id);
    if (!s) return;
    siswaTerpilihCetak = s;
    $('siswaTerpilihAvatar').textContent = initialsCetak(s.nama);
    $('siswaTerpilihNama').textContent = s.nama;
    $('siswaTerpilihMeta').textContent = `${s.nis} • Kelas ${s.kelas}`;
    $('siswaTerpilihBlock').classList.remove('hidden');
    $('siswaPickerBlockCetak').classList.add('hidden');
  }

  $('btnGantiSiswaCetak').addEventListener('click', () => {
    siswaTerpilihCetak = null;
    $('siswaTerpilihBlock').classList.add('hidden');
    $('siswaPickerBlockCetak').classList.remove('hidden');
    $('siswaSearchCetak').value = '';
    renderSiswaResultsCetak();
  });

  /* ---- Prasetel dari tautan Riwayat Siswa (?siswaId=...) ---- */
  function handleUrlPreselect() {
    const params = new URLSearchParams(window.location.search);
    const siswaId = params.get('siswaId');
    if (!siswaId) return;
    const s = siswaCache.find(x => x.id === siswaId);
    if (!s) return;
    $('modeToggle').querySelector('[data-mode="siswa"]').click();
    selectSiswaCetak(siswaId);
  }

  /* ---- Helpers ---- */
  function toDate(ts) {
    if (!ts) return null;
    if (typeof ts?.toDate === 'function') return ts.toDate();
    return new Date(ts);
  }
  function dalamRentang(ts, start, end) {
    const d = toDate(ts);
    if (!d) return false;
    return d >= start && d <= end;
  }
  function formatTanggalPendek(d) {
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }
  function initials(nama) {
    return nama.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  /* ---- Narasi otomatis ---- */
  function narasiMembaca(ayatDinilai, tajwid, makhroj, namaDepan) {
    if (!ayatDinilai) return `Belum ada data penilaian bacaan (Baca & Tandai) untuk ${namaDepan} pada periode ini.`;
    const rate = (tajwid + makhroj) / ayatDinilai;
    let kualitas = rate < 0.3
      ? 'menunjukkan penguasaan bacaan yang baik'
      : rate < 0.6
        ? 'cukup baik, dengan beberapa bagian yang masih perlu latihan lebih lanjut'
        : 'masih memerlukan bimbingan lebih intensif, terutama pada aspek tajwid dan makhraj';
    return `Selama periode ini, bacaan ${namaDepan} telah dinilai sebanyak ${ayatDinilai} ayat, dengan ${tajwid} catatan tajwid dan ${makhroj} catatan makhraj. Secara umum, bacaan ${namaDepan} ${kualitas}.`;
  }

  function narasiHafalan(isIqro, ziyadahLulus, murojaahCount, posisiTerakhir, totalSesi, namaDepan) {
    if (!totalSesi) return `Belum ada catatan setoran untuk ${namaDepan} pada periode ini.`;
    if (isIqro) {
      return `Selama periode ini, ${namaDepan} mengikuti ${totalSesi} kali sesi bimbingan membaca Iqro, dengan posisi terakhir pada ${posisiTerakhir || '-'}.`;
    }
    return `Pada periode ini, ${namaDepan} menyelesaikan ${ziyadahLulus} materi hafalan baru dan melakukan ${murojaahCount} kali muroja'ah untuk menjaga hafalan yang telah dikuasai. Posisi hafalan terakhir: ${posisiTerakhir || '-'}.`;
  }

  function menulisPosisiLabel(r) {
    if (!r) return '-';
    if (r.materi?.tipe === 'quran') return r.materi.label;
    if (r.materi?.tipe === 'iqro') return `Iqro ${r.materi.jilidIqro} — Hal. ${r.materi.halamanMulai}${r.materi.halamanAkhir !== r.materi.halamanMulai ? '–' + r.materi.halamanAkhir : ''}`;
    return `${r.jilidIqro ? `Iqro ${r.jilidIqro} — ` : ''}Halaman ${r.halamanMulai}${r.halamanAkhir !== r.halamanMulai ? '–' + r.halamanAkhir : ''}`;
  }
  function menulisRataRata(r) {
    const p = r?.penilaian;
    if (!p) return null;
    const vals = [p.hurufSambungan, p.harakat, p.keutuhanTeks, p.kerapian].filter(v => typeof v === 'number');
    if (!vals.length) return null;
    return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
  }

  function narasiMenulis(entry, totalPemeriksaan, namaDepan) {
    if (!entry) return `Belum ada catatan pemeriksaan buku salinan Al-Qur'an untuk ${namaDepan} pada periode ini.`;
    const posisi = menulisPosisiLabel(entry);
    const rata = menulisRataRata(entry);
    if (entry.materi?.tipe === 'quran' && rata) {
      const kualitas = rata >= 3.5 ? 'sangat baik'
        : rata >= 2.5 ? 'baik'
        : rata >= 1.5 ? 'cukup, dengan beberapa aspek yang masih perlu dibimbing'
        : 'masih memerlukan bimbingan intensif, terutama pada kebenaran huruf dan kelengkapan harakat';
      return `${namaDepan} telah menyalin hingga ${posisi}, dengan ${totalPemeriksaan} kali pemeriksaan oleh guru selama periode ini. Rata-rata penilaian menulis (kebenaran huruf & sambungan, kelengkapan harakat, keutuhan teks, serta kerapian & keterbacaan) berada pada level ${kualitas} (skor ${rata}/4).`;
    }
    return `${namaDepan} telah menyalin hingga ${posisi}, dengan ${totalPemeriksaan} kali pemeriksaan oleh guru selama periode ini.`;
  }

  function renderTargetSection(siswa, targetKelas, setoranFull, namaDepan) {
    if (!targetKelas) return '';
    const isIqro = siswa.jenjang === 'iqro';

    if (isIqro) {
      const entriIqro = setoranFull.filter(r => r.materi?.tipe === 'iqro');
      const posisiJilid = entriIqro[0]?.materi?.buku || 1;
      const posisiHalaman = entriIqro[0]?.materi?.halamanAkhir || 0;
      const tercapai = (posisiJilid > targetKelas.targetJilid) ||
        (posisiJilid === targetKelas.targetJilid && posisiHalaman >= targetKelas.targetHalaman);
      return `
        <div class="lpr-section">
          <h2>🎯 Target Hafalan${targetKelas.labelSemester ? ' — ' + escapeHtml(targetKelas.labelSemester) : ''}</h2>
          <div class="lpr-stat-row">
            <div class="lpr-stat"><span class="n">Iqro ${targetKelas.targetJilid}:${targetKelas.targetHalaman}</span><span class="l">Target</span></div>
            <div class="lpr-stat"><span class="n">Iqro ${posisiJilid}:${posisiHalaman || '-'}</span><span class="l">Posisi Saat Ini</span></div>
          </div>
          <p class="lpr-narasi" style="color:${tercapai ? '#2d7055' : '#c0392b'};font-weight:700">${tercapai ? `Target tercapai — ${namaDepan} sudah mencapai atau melampaui target semester ini.` : `Target belum tercapai — ${namaDepan} masih perlu bimbingan lebih lanjut untuk mencapai target semester ini.`}</p>
        </div>
      `;
    }

    const progres = hitungProgresSurah(targetKelas.targetSurah, setoranFull);
    if (!progres.length) return '';
    const tercapaiCount = progres.filter(p => {
      const surah = surahByNo(p.surahNo);
      return surah && p.maxAyatAkhir >= surah.ayat;
    }).length;

    return `
      <div class="lpr-section">
        <h2>🎯 Target Hafalan${targetKelas.labelSemester ? ' — ' + escapeHtml(targetKelas.labelSemester) : ''}</h2>
        <div class="lpr-stat-row">
          <div class="lpr-stat"><span class="n">${tercapaiCount}/${progres.length}</span><span class="l">Surah Tercapai</span></div>
        </div>
        <div class="lpr-log-list">
          ${progres.map(p => {
            const surah = surahByNo(p.surahNo);
            if (!surah) return '';
            const pct = Math.min(100, Math.round((p.maxAyatAkhir / surah.ayat) * 100));
            const dot = pct >= 100 ? 'green' : pct > 0 ? 'gold' : 'red';
            return `
              <div class="lpr-log-item">
                <span class="lpr-log-dot ${dot}"></span>
                <span class="lpr-log-materi">${escapeHtml(surah.nama)}</span>
                <span class="lpr-log-meta">${pct}%</span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  /* ---- Predikat kualitas bacaan (gauge visual) ---- */
  function hitungAkurasiBacaan(tajwid, makhroj, ayatDinilai) {
    if (!ayatDinilai) return null;
    const errPerAyat = (tajwid + makhroj) / ayatDinilai;
    const pct = Math.max(5, Math.min(100, Math.round(100 - errPerAyat * 35)));
    let label, color;
    if (errPerAyat <= 0.3) { label = 'Istimewa'; color = '#2d7055'; }
    else if (errPerAyat <= 0.7) { label = 'Baik'; color = '#3a8a68'; }
    else if (errPerAyat <= 1.5) { label = 'Cukup'; color = '#c9882a'; }
    else { label = 'Perlu Bimbingan'; color = '#c0392b'; }
    return { pct, label, color };
  }

  /* ---- Bangun satu halaman laporan ---- */
  function buildLaporanSiswa(siswa, setoranPeriode, menulisPeriode, labelSemester, guruNama, targetKelas, setoranFull) {
    const namaDepan = siswa.nama.split(' ')[0];
    const isIqro = siswa.jenjang === 'iqro';

    const sesiMembaca = setoranPeriode.filter(r => r.materi?.tipe === 'iqro' || (r.detailAyat && r.detailAyat.length) || r.detailBacaanIqro);
    let ayatDinilai = 0, tajwid = 0, makhroj = 0;
    const membacaLog = sesiMembaca.map(r => {
      let t = 0, m = 0;
      if (r.detailAyat?.length) {
        r.detailAyat.forEach(a => {
          ayatDinilai++;
          (a.kataSalah || []).forEach(k => { if (k.jenis === 'tajwid') { t++; tajwid++; } else if (k.jenis === 'makhroj') { m++; makhroj++; } });
        });
      } else if (r.detailBacaanIqro) {
        ayatDinilai++;
        (r.detailBacaanIqro.kataSalah || []).forEach(k => { if (k.jenis === 'tajwid') { t++; tajwid++; } else if (k.jenis === 'makhroj') { m++; makhroj++; } });
      }
      const total = t + m;
      const dot = total === 0 ? 'green' : total <= 2 ? 'gold' : 'red';
      return { tanggal: r.createdAt, materi: r.materi?.label || '-', meta: total === 0 ? 'Bersih' : `${t} tajwid • ${m} makhroj`, dot };
    });

    const akurasi = hitungAkurasiBacaan(tajwid, makhroj, ayatDinilai);

    const sesiHafalan = setoranPeriode.filter(r => r.jenis !== 'tahsin');
    const ziyadahLulus = sesiHafalan.filter(r => r.jenis === 'ziyadah' && r.statusHafalan === 'lulus').length;
    const murojaahCount = sesiHafalan.filter(r => r.jenis === 'murojaah').length;
    const posisiTerakhir = setoranPeriode.length ? (setoranPeriode[0].materi?.label || '-') : '-';
    const hafalanLog = sesiHafalan.map(r => ({
      tanggal: r.createdAt,
      materi: r.materi?.label || '-',
      meta: r.jenis === 'ziyadah' ? 'Ziyadah' : "Muroja'ah",
      dot: r.statusHafalan === 'lulus' ? 'green' : 'red',
    }));

    const menulisTerakhir = menulisPeriode[0];
    const menulisLog = menulisPeriode.map(r => {
      const rata = menulisRataRata(r);
      return {
        tanggal: r.tanggalPeriksa,
        materi: menulisPosisiLabel(r),
        meta: rata ? `Rata-rata ${rata}/4` : '',
        dot: 'green',
      };
    });

    const renderLog = (log, kosongMsg, maxItem = 6) => {
      if (!log.length) return `<div class="lpr-narasi" style="color:#999;font-style:italic">${kosongMsg}</div>`;
      const shown = log.slice(0, maxItem);
      const sisa = log.length - shown.length;
      return `
        <div class="lpr-log-list">
          ${shown.map(item => `
            <div class="lpr-log-item">
              <span class="lpr-log-dot ${item.dot}"></span>
              <span class="lpr-log-tgl">${formatTanggalPendek(toDate(item.tanggal) || new Date())}</span>
              <span class="lpr-log-materi">${escapeHtml(item.materi)}</span>
              ${item.meta ? `<span class="lpr-log-meta">${escapeHtml(item.meta)}</span>` : ''}
            </div>
          `).join('')}
        </div>
        ${sisa > 0 ? `<div class="lpr-log-more">…dan ${sisa} entri lainnya pada periode ini</div>` : ''}
      `;
    };

    return `
      <div class="laporan-page">
        <div class="lpr-head">
          <img src="../assets/logo.png" alt="Logo">
          <div>
            <h1>Laporan Perkembangan Tahsin-Tahfizh</h1>
            <p class="sub">SD Muhammadiyah 01 Kukusan &middot; ${escapeHtml(labelSemester || '-')}</p>
          </div>
          <span class="badge">${escapeHtml(siswa.jenjang === 'iqro' ? 'JENJANG IQRO' : 'JENJANG AL-QUR\'AN')}</span>
        </div>

        <div class="lpr-info-grid">
          <div><span class="k">Nama Siswa</span><span class="v">${escapeHtml(siswa.nama)}</span></div>
          <div><span class="k">NIS</span><span class="v">${escapeHtml(siswa.nis)}</span></div>
          <div><span class="k">Kelas</span><span class="v">${escapeHtml(siswa.kelas)}</span></div>
          <div><span class="k">Guru Pembimbing</span><span class="v">${escapeHtml(guruNama)}</span></div>
        </div>

        <div class="lpr-section">
          <h2>📖 1. Membaca Al-Qur'an</h2>
          <div class="lpr-stat-row">
            <div class="lpr-stat"><span class="n">${ayatDinilai}</span><span class="l">Ayat Dinilai</span></div>
            <div class="lpr-stat"><span class="n">${tajwid}</span><span class="l">Catatan Tajwid</span></div>
            <div class="lpr-stat"><span class="n">${makhroj}</span><span class="l">Catatan Makhraj</span></div>
          </div>
          ${akurasi ? `
            <div class="lpr-gauge-row">
              <div class="lpr-gauge-predikat">
                <span class="n" style="color:${akurasi.color}">${akurasi.pct}%</span>
                <span class="l" style="color:${akurasi.color}">${akurasi.label}</span>
              </div>
              <div class="lpr-gauge-bar-wrap">
                <div class="lpr-gauge-bar-track"><div class="lpr-gauge-bar-fill" style="width:${akurasi.pct}%;background:${akurasi.color}"></div></div>
                <div class="lpr-gauge-caption">Perkiraan akurasi bacaan berdasarkan catatan Baca &amp; Tandai selama periode ini</div>
              </div>
            </div>
          ` : ''}
          <p class="lpr-narasi">${narasiMembaca(ayatDinilai, tajwid, makhroj, namaDepan)}</p>
          ${renderLog(membacaLog, 'Belum ada sesi dengan data Baca & Tandai pada periode ini.')}
        </div>

        <div class="lpr-section">
          <h2>🎯 2. Menghapal Al-Qur'an</h2>
          <div class="lpr-stat-row">
            ${isIqro ? `
              <div class="lpr-stat"><span class="n">${sesiHafalan.length}</span><span class="l">Total Sesi</span></div>
            ` : `
              <div class="lpr-stat"><span class="n">${ziyadahLulus}</span><span class="l">Materi Baru Lulus</span></div>
              <div class="lpr-stat"><span class="n">${murojaahCount}</span><span class="l">Sesi Muroja'ah</span></div>
            `}
          </div>
          <p class="lpr-narasi">${narasiHafalan(isIqro, ziyadahLulus, murojaahCount, posisiTerakhir, sesiHafalan.length, namaDepan)}</p>
          ${renderLog(hafalanLog, 'Belum ada riwayat setoran hafalan pada periode ini.')}
        </div>

        ${renderTargetSection(siswa, targetKelas, setoranFull || setoranPeriode, namaDepan)}

        <div class="lpr-section">
          <h2>✍️ 3. Menulis Al-Qur'an</h2>
          <div class="lpr-stat-row">
            <div class="lpr-stat"><span class="n">${menulisTerakhir ? (menulisTerakhir.materi?.tipe === 'quran' ? `${menulisRataRata(menulisTerakhir) || '-'}/4` : menulisTerakhir.materi?.halamanAkhir ?? menulisTerakhir.halamanAkhir) : '-'}</span><span class="l">${menulisTerakhir?.materi?.tipe === 'quran' ? 'Rata-rata Skor' : 'Halaman Terakhir'}</span></div>
            <div class="lpr-stat"><span class="n">${menulisPeriode.length}</span><span class="l">Kali Diperiksa</span></div>
          </div>
          <p class="lpr-narasi">${narasiMenulis(menulisTerakhir, menulisPeriode.length, namaDepan)}</p>
          ${renderLog(menulisLog, 'Belum ada catatan pemeriksaan menulis pada periode ini.')}
        </div>

        <div class="lpr-ttd-section">
          <div class="lpr-ttd-tanda">Depok, ${formatTanggalPendek(new Date())}</div>
          <div class="lpr-ttd-grid">
            <div class="lpr-ttd-col">
              <div>Orang Tua/Wali,</div>
              <div class="lpr-ttd-space"></div>
              <div class="lpr-ttd-name">(……………………………)</div>
            </div>
            <div class="lpr-ttd-col">
              <div>Kepala Sekolah,</div>
              <div class="lpr-ttd-space"></div>
              <div class="lpr-ttd-name">(……………………………)</div>
            </div>
            <div class="lpr-ttd-col">
              <div>Guru Tahsin-Tahfizh,</div>
              <div class="lpr-ttd-space"></div>
              <div class="lpr-ttd-name">${escapeHtml(guruNama)}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  /* ---- Aksi utama ---- */
  $('btnBuat').addEventListener('click', async () => {
    const start = new Date($('tglMulai').value);
    const end = new Date($('tglAkhir').value);
    end.setHours(23, 59, 59, 999);
    if (isNaN(start) || isNaN(end) || start > end) { showToast('Rentang tanggal tidak valid.', true); return; }
    const labelSemester = $('labelSemester').value.trim();

    let daftarSiswa;
    if (mode === 'kelas') {
      if (!kelasTerpilih) { showToast('Pilih kelas terlebih dahulu.', true); return; }
      daftarSiswa = siswaCache.filter(s => s.kelas === kelasTerpilih).sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
      if (!daftarSiswa.length) { showToast('Tidak ada siswa di kelas ini.', true); return; }
    } else {
      if (!siswaTerpilihCetak) { showToast('Pilih siswa terlebih dahulu.', true); return; }
      daftarSiswa = [siswaTerpilihCetak];
    }

    const btn = $('btnBuat');
    btn.disabled = true;
    const labelDefault = mode === 'kelas' ? 'Buat & Cetak Laporan Kelas' : 'Buat & Cetak Laporan Siswa';

    let html = '';
    const targetCacheByKelas = {};
    for (let i = 0; i < daftarSiswa.length; i++) {
      const s = daftarSiswa[i];
      if (daftarSiswa.length > 1) $('btnBuatLabel').textContent = `Memproses ${i + 1}/${daftarSiswa.length}: ${s.nama}…`;
      try {
        const [setoran, menulis] = await Promise.all([getRiwayatSetoran(s.id, s.kelas), getMenulisLog(s.id, s.kelas)]);
        const setoranPeriode = setoran.filter(r => dalamRentang(r.createdAt, start, end));
        const menulisPeriode = menulis.filter(r => dalamRentang(r.tanggalPeriksa, start, end));
        if (!(s.kelas in targetCacheByKelas)) targetCacheByKelas[s.kelas] = await getTargetHafalan(s.kelas).catch(() => null);
        html += buildLaporanSiswa(s, setoranPeriode, menulisPeriode, labelSemester, currentUser.nama, targetCacheByKelas[s.kelas], setoran);
      } catch (err) {
        console.error(`Gagal memuat data ${s.nama}:`, err);
      }
    }

    $('reportOutput').innerHTML = html;
    btn.disabled = false;
    $('btnBuatLabel').textContent = labelDefault;

    // Beri jeda sesaat supaya browser selesai me-render sebelum dialog print muncul
    setTimeout(() => window.print(), 300);
  });
</script>
</body>
</html>

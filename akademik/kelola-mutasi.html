<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelola Mutasi — Akademik &amp; Rapor | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  .intro-text{font-size:12px;color:var(--ink-muted);line-height:1.6;margin-bottom:16px}

  .filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .filter-chip{font-size:11.5px;font-weight:800;padding:6px 13px;border-radius:20px;cursor:pointer;background:var(--surface);border:1.5px solid var(--border);color:var(--ink-mid)}
  .filter-chip.active{background:var(--green-dark);border-color:var(--green-dark);color:#fff}

  .usulan-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:11px}
  .usulan-top{display:flex;align-items:center;gap:10px}
  .usulan-icon{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .usulan-icon.masuk{background:var(--green-pale);color:var(--green-dark)}
  .usulan-icon.keluar{background:#fbe4e0;color:#a83a2b}
  .usulan-nama{font-size:13px;font-weight:700;color:var(--ink)}
  .usulan-sub{font-size:10.5px;color:var(--ink-muted);margin-top:2px;line-height:1.5}
  .status-pill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0}
  .status-pill.pending{background:var(--gold-light);color:#8a6416}
  .status-pill.disetujui{background:var(--green-pale);color:var(--green-dark)}
  .status-pill.ditolak{background:#eceae6;color:var(--ink-muted)}

  .detail-box{background:var(--bg-light);border-radius:11px;padding:10px 12px;margin-top:11px;font-size:11.5px;color:var(--ink-mid);line-height:1.7}
  .detail-box b{color:var(--ink)}

  .action-row{display:flex;gap:8px;margin-top:12px}
  .action-row .btn{flex:1;padding:10px;font-size:12.5px}
  .btn-tolak{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--red);background:var(--red-light);color:var(--red);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}

  .catatan-box{margin-top:10px}
  .catatan-box textarea{width:100%;box-sizing:border-box}

  .empty-state-small{text-align:center;padding:24px 12px;color:var(--ink-muted);font-size:12.5px}
</style>
</head>
<body>

<div class="phone-viewport">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title">Kelola Mutasi</div>
            <div class="app-header-sub">Usulan wali kelas</div>
          </div>
        </div>
      </div>

      <div class="app-body" id="appBody" style="display:none">
        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data disimulasikan di perangkat ini.</span>
        </div>
        <p class="intro-text">Setujui akan langsung mengubah data siswa (tambah siswa baru atau nonaktifkan siswa yang keluar).</p>

        <div class="filter-row">
          <button class="filter-chip active" id="fl-pending" onclick="filterStatus('pending')">Menunggu</button>
          <button class="filter-chip" id="fl-disetujui" onclick="filterStatus('disetujui')">Disetujui</button>
          <button class="filter-chip" id="fl-ditolak" onclick="filterStatus('ditolak')">Ditolak</button>
          <button class="filter-chip" id="fl-semua" onclick="filterStatus('semua')">Semua</button>
        </div>

        <div id="usulanList"></div>
        <div id="emptyState" class="usulan-card hidden">
          <div class="empty-state-small" id="emptyStateMsg"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg class="dot-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange } from '../assets/firebase.js';
  import { getMutasiSemua, setujuiMutasi, tolakMutasi } from '../assets/firestore-data-akademik.js';

  const $ = (id) => document.getElementById(id);
  let semuaUsulan = [];
  let filterAktif = 'pending';

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function showToast(msg, isError = false) {
    $('toastMsg').textContent = msg;
    const t = $('toast');
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }
  function fmtTanggal(iso) {
    if (!iso) return '-';
    try { return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch { return iso; }
  }

  onAuthChange(async (session) => {
    if (!session) { window.location.href = 'login.html'; return; }
    if (DEMO_MODE) $('demoStrip').classList.remove('hidden');
    $('appBody').style.display = 'block';

    if (session.role !== 'admin') {
      document.querySelector('.filter-row').classList.add('hidden');
      $('emptyStateMsg').textContent = 'Halaman ini khusus admin Akademik & Rapor.';
      $('emptyState').classList.remove('hidden');
      return;
    }
    await muatSemua();
  });

  async function muatSemua() {
    $('usulanList').innerHTML = `<div class="empty-state-small">Memuat usulan…</div>`;
    try {
      semuaUsulan = await getMutasiSemua();
      render();
    } catch (e) {
      console.error(e);
      showToast('Gagal memuat usulan.', true);
    }
  }

  window.filterStatus = (status) => {
    filterAktif = status;
    ['pending', 'disetujui', 'ditolak', 'semua'].forEach(s => $('fl-' + s).classList.toggle('active', s === status));
    render();
  };

  function render() {
    const list = filterAktif === 'semua' ? semuaUsulan : semuaUsulan.filter(m => m.status === filterAktif);
    if (!list.length) {
      $('usulanList').innerHTML = '';
      $('emptyStateMsg').textContent = filterAktif === 'pending' ? 'Tidak ada usulan yang menunggu.' : 'Belum ada usulan pada status ini.';
      $('emptyState').classList.remove('hidden');
      return;
    }
    $('emptyState').classList.add('hidden');
    $('usulanList').innerHTML = list.map(renderCard).join('');
  }

  function renderCard(m) {
    const isMasuk = m.jenis === 'masuk';
    const nama = isMasuk ? m.calonNama : m.siswaNama;
    const statusLabel = m.status === 'pending' ? 'Menunggu' : (m.status === 'disetujui' ? 'Disetujui' : 'Ditolak');

    const detail = isMasuk ? `
      <div class="detail-box">
        <div><b>Kelas tujuan:</b> ${escapeHtml(m.kelas)}</div>
        <div><b>Tempat, tanggal lahir:</b> ${escapeHtml(m.calonTempatLahir || '-')}, ${fmtTanggal(m.calonTanggalLahir)}</div>
        <div><b>NISN:</b> ${escapeHtml(m.calonNisn || '-')}</div>
        <div><b>NIS:</b> ${m.calonNis ? escapeHtml(m.calonNis) : 'Belum diketahui — akan dibuatkan NIS sementara'}</div>
        <div><b>Diusulkan oleh:</b> ${escapeHtml(m.createdByNama || '-')}</div>
      </div>` : `
      <div class="detail-box">
        <div><b>Kelas:</b> ${escapeHtml(m.kelas)}</div>
        <div><b>Alasan:</b> ${escapeHtml(m.alasan || '-')}</div>
        <div><b>Diusulkan oleh:</b> ${escapeHtml(m.createdByNama || '-')}</div>
      </div>`;

    const catatanTolakHtml = m.status === 'pending' ? `
      <div class="catatan-box">
        <textarea class="field-textarea" id="catatan-${m.id}" placeholder="Catatan untuk wali kelas (opsional, terlihat kalau ditolak)"></textarea>
      </div>` : (m.catatanAdmin ? `<div class="detail-box"><b>Catatan admin:</b> ${escapeHtml(m.catatanAdmin)}</div>` : '');

    const actionHtml = m.status === 'pending' ? `
      <div class="action-row">
        <button class="btn btn-primary-light" id="btnSetujui-${m.id}" onclick="setujui('${m.id}')">Setujui</button>
        <button class="btn-tolak" id="btnTolak-${m.id}" onclick="tolak('${m.id}')">Tolak</button>
      </div>` : '';

    return `
    <div class="usulan-card">
      <div class="usulan-top">
        <div class="usulan-icon ${isMasuk ? 'masuk' : 'keluar'}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${isMasuk ? '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>' : '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6"/>'}</svg>
        </div>
        <div style="flex:1;min-width:0">
          <div class="usulan-nama">${escapeHtml(nama)}</div>
          <div class="usulan-sub">${isMasuk ? 'Mutasi masuk' : 'Mutasi keluar'} · Kelas ${escapeHtml(m.kelas)}</div>
        </div>
        <span class="status-pill ${m.status}">${statusLabel}</span>
      </div>
      ${detail}
      ${catatanTolakHtml}
      ${actionHtml}
    </div>`;
  }

  window.setujui = async (id) => {
    const m = semuaUsulan.find(x => x.id === id);
    const nama = m.jenis === 'masuk' ? m.calonNama : m.siswaNama;
    const pesan = m.jenis === 'masuk'
      ? `Setujui mutasi masuk "${nama}"? Data siswa baru akan langsung dibuat.`
      : `Setujui mutasi keluar "${nama}"? Siswa akan langsung dinonaktifkan (bukan dihapus permanen).`;
    if (!confirm(pesan)) return;

    const btn = $('btnSetujui-' + id);
    btn.disabled = true; btn.textContent = 'Memproses…';
    try {
      await setujuiMutasi(id);
      showToast('Usulan disetujui.');
      await muatSemua();
    } catch (e) {
      console.error(e);
      showToast(e.message || 'Gagal menyetujui usulan.', true);
      btn.disabled = false; btn.textContent = 'Setujui';
    }
  };

  window.tolak = async (id) => {
    if (!confirm('Tolak usulan ini?')) return;
    const catatan = $('catatan-' + id)?.value.trim() || '';
    const btn = $('btnTolak-' + id);
    btn.disabled = true; btn.textContent = 'Memproses…';
    try {
      await tolakMutasi(id, catatan);
      showToast('Usulan ditolak.');
      await muatSemua();
    } catch (e) {
      console.error(e);
      showToast('Gagal menolak usulan.', true);
      btn.disabled = false; btn.textContent = 'Tolak';
    }
  };

  $('btnBack').addEventListener('click', () => { window.location.href = 'admin-hub.html'; });
</script>
</body>
</html>

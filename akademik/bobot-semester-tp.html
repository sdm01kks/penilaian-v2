<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bobot Semester TP — Akademik &amp; Rapor | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  .info-strip{font-size:11.5px;color:var(--ink-muted);font-weight:600;margin-bottom:14px}

  .empty-scope{padding:60px 24px;text-align:center}
  .empty-scope svg{width:40px;height:40px;color:var(--ink-muted);margin-bottom:12px}
  .empty-scope p{font-size:13px;color:var(--ink-muted);line-height:1.6}

  .semester-section{margin-bottom:20px}
  .semester-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .semester-head-title{font-size:12.5px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
  .total-chip{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0}
  .total-chip.ok{background:var(--green-pale);color:var(--green-dark)}
  .total-chip.warn{background:var(--gold-light);color:#8a6416}
  .btn-ratakan{
    font-family:inherit;font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:8px;
    border:none;background:var(--gold-light);color:#8a6416;cursor:pointer;flex-shrink:0;
  }

  .tp-row{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:10px 12px;margin-bottom:8px}
  .tp-row-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .tp-row-nama{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tp-row-persen{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .tp-row-persen input{
    width:52px;padding:6px 4px;text-align:center;border-radius:8px;border:1.5px solid var(--border);
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink);outline:none;
  }
  .tp-row-persen input:focus{border-color:var(--green-light)}
  .tp-row-persen span{font-size:11.5px;font-weight:700;color:var(--ink-muted)}
  .tp-row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .pindah-btn{
    font-family:inherit;font-size:10px;font-weight:700;padding:5px 9px;border-radius:20px;
    border:1px solid var(--border);background:var(--bg-light);color:var(--ink-mid);cursor:pointer;
  }
  .pindah-btn.aktif{background:var(--green-pale);border-color:var(--green-dark);color:var(--green-dark)}

  .empty-section{font-size:11px;color:var(--ink-muted);font-style:italic;padding:10px 2px}

  .btn-simpan-semua{width:100%;margin-top:6px;padding:13px;font-size:13px;position:sticky;bottom:12px}
</style>
</head>
<body>

<div class="phone-viewport">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title" id="titleMapel">Bobot Semester TP</div>
            <div class="app-header-sub" id="subTingkatan">Memuat…</div>
          </div>
        </div>
      </div>

      <div class="app-body" id="appBody" style="display:none">
        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data tersimpan sementara di perangkat ini.</span>
        </div>
        <div class="info-strip">Persentase dihitung TERPISAH per semester — TP semester 1 dan TP semester 2 masing-masing seharusnya total 100%, bukan digabung.</div>

        <div id="belumSection" class="semester-section"></div>
        <div id="sem1Section" class="semester-section"></div>
        <div id="sem2Section" class="semester-section"></div>

        <button class="btn btn-primary btn-simpan-semua" id="btnSimpanSemua" onclick="simpanSemua()">Simpan Semua</button>
      </div>

      <div id="emptyScope" class="empty-scope hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <p id="emptyScopeMsg">Memuat…</p>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg class="dot-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange } from '../assets/firebase.js';
  import {
    getTPList, saveBobotSemesterBatch, normalisasiPersenBobotMapel,
  } from '../assets/firestore-data-akademik.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const mapelNama = params.get('mapel') || '';
  const tingkatan = params.get('tingkatan') || '';

  let state = []; // [{id, nomorTp, namaTp, semester: '1'|'2'|undefined, bobotMapel}]

  function showToast(msg, isError = false) {
    $('toastMsg').textContent = msg;
    const t = $('toast');
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function showEmptyScope(msg) {
    $('emptyScopeMsg').textContent = msg;
    $('emptyScope').classList.remove('hidden');
  }
  function labelTp(tp) {
    return `${tp.nomorTp ?? '?'}. ${tp.namaTp || '(tanpa nama)'}`;
  }

  onAuthChange(async (s) => {
    if (!s) { window.location.href = 'login.html'; return; }

    if (!mapelNama || !tingkatan) { showEmptyScope('Tautan tidak lengkap — mapel/tingkatan tidak diketahui.'); return; }
    const penugasan = Array.isArray(s.penugasan) ? s.penugasan : [];
    const berhak = penugasan.some(p => p.mapel === mapelNama);
    if (s.role === 'admin' || !berhak) {
      showEmptyScope('Bobot Semester TP khusus guru pengampu mapel ini.');
      return;
    }

    if (DEMO_MODE) $('demoStrip').classList.remove('hidden');
    $('appBody').style.display = 'block';
    $('titleMapel').textContent = mapelNama;
    $('subTingkatan').textContent = `Tingkat ${tingkatan}`;

    try {
      const tpList = await getTPList({ mapel: mapelNama, tingkatan });
      if (!tpList.length) { showEmptyScope('Belum ada TP untuk mapel & tingkatan ini — buat dulu lewat Setup TP.'); return; }
      state = tpList.map(tp => ({ id: tp.id, nomorTp: tp.nomorTp, namaTp: tp.namaTp, semester: tp.semester || undefined, bobotMapel: tp.bobotMapel ?? 1 }))
        .sort((a, b) => (a.nomorTp ?? 0) - (b.nomorTp ?? 0));
      renderAll();
    } catch (e) {
      console.error(e);
      showToast('Gagal memuat data.', true);
    }
  });

  function totalSemester(sem) {
    return state.filter(t => t.semester === sem).reduce((a, t) => a + (Number(t.bobotMapel) || 0), 0);
  }

  function renderAll() {
    renderBelum();
    renderSemester('1', 'sem1Section', 'Semester 1');
    renderSemester('2', 'sem2Section', 'Semester 2');
  }

  function renderBelum() {
    const items = state.filter(t => !t.semester);
    const wrap = $('belumSection');
    if (!items.length) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div class="semester-head"><span class="semester-head-title">⚠️ Belum Dikelompokkan (${items.length})</span></div>
      ${items.map(tp => `
        <div class="tp-row">
          <div class="tp-row-top"><div class="tp-row-nama">${escapeHtml(labelTp(tp))}</div></div>
          <div class="tp-row-actions">
            <button class="pindah-btn" onclick="tetapkanSemester('${tp.id}','1')">Tetapkan ke Semester 1</button>
            <button class="pindah-btn" onclick="tetapkanSemester('${tp.id}','2')">Tetapkan ke Semester 2</button>
          </div>
        </div>`).join('')}`;
  }

  function renderSemester(sem, elId, judul) {
    const items = state.filter(t => t.semester === sem);
    const wrap = $(elId);
    if (!items.length) {
      wrap.innerHTML = `<div class="semester-head"><span class="semester-head-title">${judul}</span></div><div class="empty-section">Belum ada TP di semester ini.</div>`;
      return;
    }
    const total = totalSemester(sem);
    const pas = Math.abs(total - 100) < 0.5;
    const lain = sem === '1' ? '2' : '1';
    wrap.innerHTML = `
      <div class="semester-head">
        <span class="semester-head-title">${judul}</span>
        <span class="total-chip ${pas ? 'ok' : 'warn'}">${pas ? '✅' : '⚠️'} Total ${total}%</span>
        ${items.length > 1 ? `<button class="btn-ratakan" onclick="ratakan('${sem}')">Ratakan ke 100%</button>` : ''}
      </div>
      ${items.map(tp => `
        <div class="tp-row">
          <div class="tp-row-top">
            <div class="tp-row-nama">${escapeHtml(labelTp(tp))}</div>
            <div class="tp-row-persen">
              <input type="number" min="0" max="100" step="1" value="${tp.bobotMapel}" oninput="ubahPersen('${tp.id}', this.value)">
              <span>%</span>
            </div>
          </div>
          <div class="tp-row-actions">
            <button class="pindah-btn" onclick="tetapkanSemester('${tp.id}','${lain}')">→ Pindah ke Semester ${lain}</button>
          </div>
        </div>`).join('')}`;
  }

  window.tetapkanSemester = (id, sem) => {
    const tp = state.find(t => t.id === id);
    if (!tp) return;
    const totalSekarang = totalSemester(sem);
    tp.semester = sem;
    tp.bobotMapel = Math.max(0, 100 - totalSekarang); // saran awal, tetap bisa diedit
    renderAll();
  };

  window.ubahPersen = (id, val) => {
    const tp = state.find(t => t.id === id);
    if (!tp) return;
    tp.bobotMapel = val === '' ? 0 : Math.max(0, Math.min(100, parseFloat(val)));
    // Cukup update chip total tanpa render ulang seluruh input (supaya
    // fokus/kursor input yang sedang diketik tidak hilang).
    const sem = tp.semester;
    const total = totalSemester(sem);
    const pas = Math.abs(total - 100) < 0.5;
    const chip = document.querySelector(`#sem${sem}Section .total-chip`);
    if (chip) {
      chip.textContent = `${pas ? '✅' : '⚠️'} Total ${total}%`;
      chip.className = `total-chip ${pas ? 'ok' : 'warn'}`;
    }
  };

  window.ratakan = (sem) => {
    const items = state.filter(t => t.semester === sem);
    const hasil = normalisasiPersenBobotMapel(items.map(t => ({ id: t.id, bobotMapel: t.bobotMapel })));
    hasil.forEach(h => {
      const tp = state.find(t => t.id === h.id);
      if (tp) tp.bobotMapel = h.bobotBaru;
    });
    renderAll();
  };

  window.simpanSemua = async () => {
    const daftar = state.filter(t => t.semester).map(t => ({ id: t.id, semester: t.semester, bobotMapel: Number(t.bobotMapel) || 0 }));
    if (!daftar.length) { showToast('Belum ada TP yang dikelompokkan ke semester manapun.', true); return; }

    const belumDiatur = state.filter(t => !t.semester).length;
    const total1 = totalSemester('1'), total2 = totalSemester('2');
    const pesanPeringatan = [];
    if (belumDiatur) pesanPeringatan.push(`${belumDiatur} TP masih belum dikelompokkan ke semester manapun (tidak akan dihitung sampai dikelompokkan).`);
    if (state.some(t => t.semester === '1') && Math.abs(total1 - 100) >= 0.5) pesanPeringatan.push(`Total Semester 1 = ${total1}%, bukan 100%.`);
    if (state.some(t => t.semester === '2') && Math.abs(total2 - 100) >= 0.5) pesanPeringatan.push(`Total Semester 2 = ${total2}%, bukan 100%.`);
    if (pesanPeringatan.length && !confirm(`${pesanPeringatan.join('\n')}\n\nTetap simpan?`)) return;

    const btn = $('btnSimpanSemua');
    btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      await saveBobotSemesterBatch(daftar);
      showToast('Tersimpan.');
    } catch (e) {
      console.error(e);
      showToast('Gagal menyimpan.', true);
    } finally {
      btn.disabled = false; btn.textContent = 'Simpan Semua';
    }
  };

  $('btnBack').addEventListener('click', () => { window.location.href = 'bobot-semester-hub.html'; });
</script>
</body>
</html>

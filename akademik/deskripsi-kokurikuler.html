<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deskripsi Gabungan Kokurikuler | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  .info-strip{font-size:11.5px;color:var(--ink-muted);font-weight:600;margin-bottom:14px}

  .empty-scope{padding:60px 24px;text-align:center}
  .empty-scope svg{width:40px;height:40px;color:var(--ink-muted);margin-bottom:12px}
  .empty-scope p{font-size:13px;color:var(--ink-muted);line-height:1.6}

  .siswa-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .siswa-card-head{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
  .siswa-avatar{width:34px;height:34px;border-radius:50%;background:var(--green-pale);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0}
  .siswa-head-body{flex:1;min-width:0}
  .siswa-head-nama{font-size:13px;font-weight:700;color:var(--ink)}
  .siswa-head-meta{font-size:10.5px;color:var(--ink-muted);margin-top:2px}
  .siswa-card-body{display:none;padding:0 14px 16px}
  .siswa-card.open .siswa-card-body{display:block}
  .siswa-card.open .chevron{transform:rotate(180deg)}

  .bukti-box{background:var(--bg-light);border-radius:13px;padding:11px 12px;margin-bottom:10px}
  .bukti-judul{font-size:10.5px;font-weight:800;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}
  .bukti-item{font-size:11.5px;color:var(--ink);line-height:1.5;margin-bottom:5px;padding-left:10px;border-left:2px solid var(--green-light)}
  .bukti-item b{color:var(--green-dark)}
  .bukti-empty{font-size:11px;color:var(--ink-muted);font-style:italic}
  .bukti-loading{font-size:11px;color:var(--ink-muted)}

  .desc-textarea{
    width:100%;min-height:120px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);
    font-family:inherit;font-size:12.5px;color:var(--ink);outline:none;resize:vertical;background:var(--surface);margin-bottom:8px;line-height:1.6;
  }
  .desc-textarea:focus{border-color:var(--green-light)}
  .btn-row{display:flex;gap:8px}
  .btn-row .btn{flex:1;padding:10px;font-size:12px}
</style>
</head>
<body>

<div class="phone-viewport">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title">Deskripsi Kokurikuler</div>
            <div class="app-header-sub" id="subKelas">Memuat…</div>
          </div>
        </div>
      </div>

      <div class="app-body" id="appBody" style="display:none">
        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data tersimpan sementara di perangkat ini.</span>
        </div>
        <div class="info-strip" id="infoStrip"></div>
        <div id="siswaList"></div>
      </div>

      <div id="emptyScope" class="empty-scope hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <p id="emptyScopeMsg">Memuat…</p>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg class="dot-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange } from '../assets/firebase.js';
  import {
    getSiswaByKelas, getConfigAkademik, getDPLListByKelas, DPL_LEVEL_LABEL,
    getKokurikulerRaporSiswa, getG7kaihByKelas, DAFTAR_KEBIASAAN_7KAIH,
    getKokurikulerRaporByKelas, saveDeskripsiKokurikulerSiswa,
    susunDraftDeskripsiKokurikuler, tingkatanDariKelas,
  } from '../assets/firestore-data-akademik.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const kelas = params.get('kelas') || '';
  const tingkatan = tingkatanDariKelas(kelas);

  let config = null, siswaList = [], dplList = [], g7kaihMap = {}, deskripsiMap = {};
  const buktiCache = {}; // siswaId -> { stem: [...], g7kaih: [...] }

  function showToast(msg, isError = false) {
    $('toastMsg').textContent = msg;
    const t = $('toast');
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function showEmptyScope(msg) {
    $('emptyScopeMsg').textContent = msg;
    $('emptyScope').classList.remove('hidden');
  }
  function initials(nama) {
    return (nama || '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }

  onAuthChange(async (s) => {
    if (!s) { window.location.href = 'login.html'; return; }

    if (!kelas) { showEmptyScope('Tautan tidak lengkap — kelas tidak diketahui.'); return; }
    const berhak = s.role === 'admin' || (s.waliKelas || []).includes(kelas);
    if (!berhak) {
      showEmptyScope(`Anda bukan wali kelas ${kelas}. Fitur ini khusus wali kelas.`);
      return;
    }

    if (DEMO_MODE) $('demoStrip').classList.remove('hidden');
    $('appBody').style.display = 'block';
    $('subKelas').textContent = `Kelas ${kelas}`;

    try {
      config = await getConfigAkademik();
      const [siswa, dpl, g7k, deskripsi] = await Promise.all([
        getSiswaByKelas(kelas),
        getDPLListByKelas(kelas),
        getG7kaihByKelas(kelas, config.semesterAktif, config.tahunAjaran),
        getKokurikulerRaporByKelas(kelas, config.semesterAktif, config.tahunAjaran),
      ]);
      siswaList = siswa; dplList = dpl; g7kaihMap = g7k; deskripsiMap = deskripsi;

      $('infoStrip').textContent = `Semester ${config.semesterAktif} · Tahun Ajaran ${config.tahunAjaran} · satu deskripsi gabungan per siswa, ini yang tercetak di rapor SAS`;

      if (!siswaList.length) { showEmptyScope('Belum ada data siswa aktif untuk kelas ini.'); return; }
      renderSiswaList();
    } catch (e) {
      console.error(e);
      showToast('Gagal memuat data.', true);
    }
  });

  function renderSiswaList() {
    $('siswaList').innerHTML = siswaList.map((sw, i) => {
      const sudahAda = !!(deskripsiMap[sw.id]?.deskripsiGabungan);
      return `
      <div class="siswa-card" id="swc-${i}" data-siswa="${sw.id}">
        <div class="siswa-card-head" onclick="toggleCard(${i})">
          <div class="siswa-avatar">${escapeHtml(initials(sw.nama))}</div>
          <div class="siswa-head-body">
            <div class="siswa-head-nama">${escapeHtml(sw.nama)}</div>
            <div class="siswa-head-meta">${sudahAda ? 'Deskripsi sudah tersusun' : 'Belum disusun'}</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition:transform .2s;flex-shrink:0"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="siswa-card-body" id="swb-${i}">
          <div class="bukti-loading">Buka untuk memuat bukti…</div>
        </div>
      </div>`;
    }).join('');
  }

  window.toggleCard = async (i) => {
    const card = $('swc-' + i);
    const wasOpen = card.classList.contains('open');
    card.classList.toggle('open');
    if (wasOpen) return; // sedang ditutup, tidak perlu muat ulang

    const siswaId = card.dataset.siswa;
    if (!buktiCache[siswaId]) {
      try {
        const buktiStem = await getKokurikulerRaporSiswa(siswaId, kelas, config.semesterAktif, config.tahunAjaran);
        const dok = g7kaihMap[siswaId];
        const buktiG7kaih = DAFTAR_KEBIASAAN_7KAIH
          .map(k => {
            const entri = dok?.kebiasaan?.[k.id];
            if (!entri || !entri.catatan) return null;
            const dpl = dplList.find(d => d.id === entri.dplId);
            return { kebiasaanId: k.id, kebiasaanLabel: k.label, dplNama: dpl ? dpl.nama : null, catatan: entri.catatan };
          })
          .filter(Boolean);
        buktiCache[siswaId] = { stem: buktiStem, g7kaih: buktiG7kaih };
      } catch (e) {
        console.error(e);
        showToast('Gagal memuat bukti siswa ini.', true);
        buktiCache[siswaId] = { stem: [], g7kaih: [] };
      }
    }
    renderBukti(i, siswaId);
  };

  function renderBukti(i, siswaId) {
    const { stem, g7kaih } = buktiCache[siswaId];
    const existing = deskripsiMap[siswaId]?.deskripsiGabungan || '';

    const stemHtml = stem.length
      ? stem.map(b => `<div class="bukti-item"><b>${escapeHtml(b.dplNama)}</b> (${escapeHtml(DPL_LEVEL_LABEL[b.level - 1] || '')}) — ${escapeHtml(b.deskripsi || '(tanpa deskripsi)')} <span style="color:var(--ink-muted)">· ${escapeHtml(b.proyekJudul)}</span></div>`).join('')
      : `<div class="bukti-empty">Belum ada nilai DPL Proyek STEM untuk siswa ini semester ini.</div>`;

    const g7kaihHtml = g7kaih.length
      ? g7kaih.map(b => `<div class="bukti-item"><b>${escapeHtml(b.dplNama || '(DPL belum dipilih)')}</b> — ${escapeHtml(b.kebiasaanLabel)}: ${escapeHtml(b.catatan)}</div>`).join('')
      : `<div class="bukti-empty">Belum ada catatan 7KAIH untuk siswa ini semester ini.</div>`;

    $('swb-' + i).innerHTML = `
      <div class="bukti-box">
        <div class="bukti-judul">Bukti Proyek STEM</div>
        ${stemHtml}
      </div>
      <div class="bukti-box">
        <div class="bukti-judul">Bukti 7KAIH</div>
        ${g7kaihHtml}
      </div>
      <textarea class="desc-textarea" id="desc-${siswaId}" placeholder="Deskripsi gabungan Kokurikuler — sebutkan nama dimensi secara eksplisit, sertakan capaian dan area yang masih perlu dikembangkan…">${escapeHtml(existing)}</textarea>
      <div class="btn-row">
        <button class="btn btn-secondary-light" onclick="susunDraft('${siswaId}', ${i})">Susun Draf Otomatis</button>
        <button class="btn btn-primary-light" onclick="simpanDeskripsi('${siswaId}', ${i})">Simpan</button>
      </div>`;
  }

  window.susunDraft = (siswaId, i) => {
    const box = $('desc-' + siswaId);
    if (box.value.trim() && !confirm('Kotak deskripsi sudah ada isinya. Timpa dengan draf otomatis?')) return;
    const { stem, g7kaih } = buktiCache[siswaId];
    const draf = susunDraftDeskripsiKokurikuler(stem, g7kaih);
    if (!draf) { showToast('Belum ada bukti STEM maupun 7KAIH yang bisa disusun — isi dulu salah satunya.', true); return; }
    box.value = draf;
    showToast('Draf disusun — tinjau & sunting sebelum menyimpan.');
  };

  window.simpanDeskripsi = async (siswaId, i) => {
    const deskripsiGabungan = $('desc-' + siswaId).value.trim();
    if (!deskripsiGabungan) { showToast('Deskripsi masih kosong.', true); return; }
    try {
      const existingId = deskripsiMap[siswaId]?.id || null;
      await saveDeskripsiKokurikulerSiswa({ siswaId, kelas, tingkatan, semester: config.semesterAktif, tahunAjaran: config.tahunAjaran, deskripsiGabungan }, existingId);
      showToast('Tersimpan.');
      deskripsiMap = await getKokurikulerRaporByKelas(kelas, config.semesterAktif, config.tahunAjaran);
      $('swc-' + i).querySelector('.siswa-head-meta').textContent = 'Deskripsi sudah tersusun';
    } catch (e) {
      console.error(e);
      showToast('Gagal menyimpan.', true);
    }
  };

  $('btnBack').addEventListener('click', () => { window.location.href = 'deskripsi-kokurikuler-hub.html'; });
</script>
</body>
</html>

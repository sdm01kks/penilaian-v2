<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Input Nilai STS — Akademik &amp; Rapor | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  .intro-text{font-size:12px;color:var(--ink-muted);line-height:1.6;margin-bottom:16px}

  .task-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:13px 14px;margin-bottom:10px;
  }
  .task-top{display:flex;align-items:center;gap:10px}
  .task-badge{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;background:var(--blue-light);color:var(--blue)}
  .task-title{font-size:13px;font-weight:800;color:var(--ink)}
  .task-sub{font-size:10.5px;color:var(--ink-muted);margin-top:1px}
  .task-chip-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;flex-wrap:wrap}
  .status-chip{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0}
  .sc-done{background:var(--green-pale);color:var(--green-dark)}
  .sc-warn{background:#fbe4e0;color:#a83a2b}
  .sc-partial{background:var(--gold-light);color:#8a6416}
  .setup-hint, .status-link{font-size:10.5px;font-weight:800;color:var(--blue);text-decoration:underline}

  .empty-state-small{text-align:center;padding:24px 12px;color:var(--ink-muted);font-size:12.5px}
</style>
</head>
<body>

<div class="phone-viewport">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title">Input Nilai STS</div>
            <div class="app-header-sub">Pilih mata pelajaran</div>
          </div>
        </div>
      </div>

      <div class="app-body" id="appBody" style="display:none">
        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data disimulasikan di perangkat ini.</span>
        </div>
        <p class="intro-text">Pilih mata pelajaran &amp; kelas untuk input nilai STS.</p>
        <div id="taskList"></div>
        <div id="emptyState" class="task-card hidden">
          <div class="empty-state-small" id="emptyStateMsg"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg class="dot-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange } from '../assets/firebase.js';
  import { tingkatanDariKelas, getSiswaByKelas, getConfigAkademik, getCakupanTP, getNilaiAsesmenSummary } from '../assets/firestore-data-akademik.js';

  const $ = (id) => document.getElementById(id);
  const JENIS = 'sts';
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function showToast(msg, isError = false) {
    $('toastMsg').textContent = msg;
    const t = $('toast');
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }

  let config = null;

  onAuthChange(async (session) => {
    if (!session) { window.location.href = 'login.html'; return; }
    if (DEMO_MODE) $('demoStrip').classList.remove('hidden');
    $('appBody').style.display = 'block';

    if (session.role === 'admin') {
      $('emptyStateMsg').textContent = 'Nilai STS diinput oleh guru mata pelajaran, bukan admin.';
      $('emptyState').classList.remove('hidden');
      return;
    }
    const penugasan = Array.isArray(session.penugasan) ? session.penugasan : [];
    if (!penugasan.length) {
      $('emptyStateMsg').textContent = 'Belum ada penugasan mata pelajaran untuk akun ini.';
      $('emptyState').classList.remove('hidden');
      return;
    }

    try {
      config = await getConfigAkademik();
      await renderTaskList(penugasan);
    } catch (e) {
      console.error(e);
      showToast('Gagal memuat data.', true);
    }
  });

  async function renderTaskList(penugasan) {
    const wrap = $('taskList');
    wrap.innerHTML = penugasan.map((p, i) => `<div class="task-card" id="task-${i}">
      <div class="task-top">
        <div class="task-badge">${escapeHtml(p.kelas)}</div>
        <div><div class="task-title">${escapeHtml(p.mapel)}</div><div class="task-sub">Kelas ${escapeHtml(p.kelas)} · Memuat status…</div></div>
      </div>
    </div>`).join('');

    for (let i = 0; i < penugasan.length; i++) {
      const p = penugasan[i];
      const tingkatan = tingkatanDariKelas(p.kelas);
      const el = $('task-' + i);
      try {
        const cakupan = await getCakupanTP({ mapel: p.mapel, kelas: p.kelas, semester: config.semesterAktif, tahunAjaran: config.tahunAjaran, jenis: JENIS });
        const tpIds = cakupan?.tpIds || [];

        el.querySelector('.task-sub').textContent = `Kelas ${p.kelas}`;
        const chipRow = document.createElement('div');
        chipRow.className = 'task-chip-row';

        if (!tpIds.length) {
          chipRow.innerHTML = `<span class="status-chip sc-warn">Cakupan belum diatur</span>
            <a class="setup-hint" href="nilai-sts-cakupan.html?mapel=${encodeURIComponent(p.mapel)}&kelas=${encodeURIComponent(p.kelas)}">Atur cakupan →</a>`;
          el.appendChild(chipRow);
          continue;
        }

        const siswaList = await getSiswaByKelas(p.kelas);
        const jmlSiswa = siswaList.length;
        const summary = await getNilaiAsesmenSummary({ jenis: JENIS, mapel: p.mapel, kelas: p.kelas, semester: config.semesterAktif, tahunAjaran: config.tahunAjaran });
        let tpLengkap = 0;
        tpIds.forEach(tpId => {
          const nilaiTp = summary[tpId] || [];
          if (jmlSiswa > 0 && nilaiTp.length >= jmlSiswa) tpLengkap++;
        });

        const statusChip = tpLengkap === tpIds.length
          ? `<span class="status-chip sc-done">STS lengkap semua TP (${tpIds.length})</span>`
          : `<span class="status-chip sc-partial">STS lengkap ${tpLengkap}/${tpIds.length} TP</span>`;
        const nilaiUrl = `nilai-sts.html?mapel=${encodeURIComponent(p.mapel)}&kelas=${encodeURIComponent(p.kelas)}`;
        chipRow.innerHTML = `${statusChip}<a class="status-link" href="${nilaiUrl}">Buka →</a>`;
        el.appendChild(chipRow);
      } catch (e) {
        console.error(e);
        el.querySelector('.task-sub').textContent = `Kelas ${p.kelas} · Gagal memuat status`;
      }
    }
  }

  $('btnBack').addEventListener('click', () => { window.location.href = 'nilai-sts-hub.html'; });
</script>
</body>
</html>

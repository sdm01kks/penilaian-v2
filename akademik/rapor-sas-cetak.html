<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapor SAS — Akademik &amp; Rapor | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  .info-strip{font-size:11.5px;color:var(--ink-muted);font-weight:600;margin-bottom:14px}
  .btn-cetak{width:100%;padding:12px;font-size:13px;margin-bottom:6px}
  .cetak-hint{font-size:11px;color:var(--ink-muted);text-align:center;margin-bottom:16px;line-height:1.5}

  .empty-scope{padding:60px 24px;text-align:center}
  .empty-scope svg{width:40px;height:40px;color:var(--ink-muted);margin-bottom:12px}
  .empty-scope p{font-size:13px;color:var(--ink-muted);line-height:1.6}

  /* ---- Pratinjau di layar — sama filosofi rapor-sts-cetak.html: sumber
     cetak sesungguhnya dibangun ulang murni sebagai string HTML lewat
     buildBodyPrint(), dipakai identik untuk pratinjau & jendela cetak. ---- */
  .rpr-preview{
    background:#fff;color:#1a1a1a;border-radius:14px;padding:16pt 14pt;
    font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;line-height:1.5;
    box-shadow:0 4px 20px rgba(0,0,0,.15);margin-bottom:16px;
  }
  .rpr-preview .rpr-title{text-align:center;font-size:12pt;font-weight:700;text-transform:uppercase;letter-spacing:.4pt;margin-bottom:2pt}
  .rpr-preview .rpr-subtitle{text-align:center;font-size:10pt;font-weight:700;margin-bottom:10pt}
  .rpr-preview .rpr-header{border-bottom:2.5pt double #000;padding-bottom:8pt;margin-bottom:10pt}
  .rpr-preview .rpr-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1pt 20pt}
  .rpr-preview .rpr-info-row{display:flex;font-size:9pt}
  .rpr-preview .rpr-info-label{width:78pt;flex-shrink:0;font-weight:700}
  .rpr-preview .rpr-info-sep{width:7pt;flex-shrink:0}
  .rpr-preview .rpr-info-val{flex:1}
  .rpr-preview .rpr-section-title{font-size:9.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.3pt;margin:12pt 0 5pt;padding-bottom:2pt;border-bottom:1pt solid #000}
  .rpr-preview table{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:6pt}
  .rpr-preview th{border:1pt solid #000;padding:4pt 6pt;background:#e8e8e8;font-weight:700;text-align:center}
  .rpr-preview td{border:1pt solid #000;padding:4pt 6pt;vertical-align:top}
  .rpr-preview .td-no{text-align:center;width:22pt}
  .rpr-preview .td-nilai{text-align:center;width:40pt}
  .rpr-preview .td-predikat{text-align:center;width:56pt}
  .rpr-preview .capaian-text{font-size:8.3pt;line-height:1.5;color:#222}
  .rpr-preview .capaian-text .lbl{font-weight:700}
  .rpr-preview .absensi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6pt;margin-bottom:8pt}
  .rpr-preview .absensi-box{border:1pt solid #000;border-radius:4pt;text-align:center;padding:6pt 4pt}
  .rpr-preview .absensi-box .n{font-size:13pt;font-weight:700}
  .rpr-preview .absensi-box .l{font-size:8pt;color:#444}
  .rpr-preview .catatan-box{border:1pt solid #000;border-radius:4pt;padding:8pt;font-size:9pt;min-height:34pt;margin-bottom:8pt}
  .rpr-preview .keputusan-box{border:1.5pt solid #000;border-radius:4pt;padding:8pt;font-size:10pt;font-weight:700;text-align:center;margin-bottom:4pt}
  .rpr-preview .rpr-ttd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8pt;margin-top:20pt;font-size:9pt}
  .rpr-preview .rpr-ttd-col{text-align:center}
  .rpr-preview .rpr-ttd-space{height:36pt}
  .rpr-preview .rpr-ttd-name{font-weight:700;border-top:1pt solid #000;padding-top:2pt}
  .rpr-preview .rpr-ttd-nbm{font-size:8pt;color:#555;min-height:10pt}
  .rpr-preview .rpr-ttd-tanda{text-align:right;font-size:9pt;margin-bottom:8pt}
</style>
</head>
<body>

<div class="phone-viewport">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title" id="titleNama">Rapor SAS</div>
            <div class="app-header-sub" id="subKelas">Memuat…</div>
          </div>
        </div>
      </div>

      <div class="app-body" id="appBody" style="display:none">
        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data disimulasikan di perangkat ini.</span>
        </div>
        <div class="info-strip" id="infoStrip"></div>
        <button class="btn btn-primary-light btn-cetak" id="btnCetak">Cetak / Simpan sebagai PDF</button>
        <p class="cetak-hint">Membuka jendela baru siap-cetak ukuran A4 — izinkan pop-up kalau diminta browser.</p>

        <div id="previewWrap"></div>
      </div>

      <div id="emptyScope" class="empty-scope hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <p id="emptyScopeMsg">Memuat…</p>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg class="dot-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange } from '../assets/firebase.js';
  import {
    getConfigAkademik, getSiswaByKelas, getRaporSASSiswa,
    getKokurikulerRaporSiswa, getEkstrakurikulerRaporSiswa, EKS_LEVEL_LABEL,
    getAbsensiRaporByKelas, DPL_LEVEL_LABEL,
  } from '../assets/firestore-data-akademik.js';

  const $ = (id) => document.getElementById(id);
  const params  = new URLSearchParams(location.search);
  const kelas   = params.get('kelas') || '';
  const siswaId = params.get('siswaId') || '';
  let session   = null;
  let raporData = null; // dipakai preview & cetakPDF()

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function showToast(msg, isError = false) {
    $('toastMsg').textContent = msg;
    const t = $('toast');
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
  function showEmptyScope(msg) {
    $('emptyScopeMsg').textContent = msg;
    $('emptyScope').classList.remove('hidden');
  }

  /* Fase Kurikulum Merdeka dari nomor kelas — kelas 1–2 -> A, 3–4 -> B, 5–6 -> C. */
  function faseDariKelas(kelas) {
    const n = parseInt(String(kelas).replace(/[^0-9]/g, ''), 10);
    if (isNaN(n)) return '?';
    return n <= 2 ? 'A' : n <= 4 ? 'B' : 'C';
  }
  const EKS_PREDIKAT_LABEL = ['Layak', 'Cakap', 'Mahir']; // level 1-3 tampil di rapor (4=Tidak Ikut disaring di data layer)

  const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  function tanggalIndonesia(d) {
    return `${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`;
  }

  onAuthChange(async (s) => {
    if (!s) { window.location.href = 'login.html'; return; }
    session = s;
    if (DEMO_MODE) $('demoStrip').classList.remove('hidden');

    if (!kelas || !siswaId) { showEmptyScope('Tautan tidak lengkap — kelas atau siswa tidak diketahui.'); return; }
    const berhak = s.role === 'admin' || (s.waliKelas || []).includes(kelas);
    if (!berhak) { showEmptyScope(`Anda bukan wali kelas ${kelas}.`); return; }

    try {
      const [config, siswaList] = await Promise.all([
        getConfigAkademik(),
        getSiswaByKelas(kelas),
      ]);
      const siswa = siswaList.find(sw => sw.id === siswaId);
      if (!siswa) { showEmptyScope('Data siswa tidak ditemukan di kelas ini.'); return; }

      const tingkatan = String(kelas).replace(/[^0-9]/g, '');
      const semester = config.semesterAktif, tahunAjaran = config.tahunAjaran;

      const [daftarNilai, kokurikuler, ekstrakurikuler, absensiMap] = await Promise.all([
        getRaporSASSiswa({ siswaId, kelas, tingkatan, semester, tahunAjaran }),
        getKokurikulerRaporSiswa(siswaId, kelas, semester, tahunAjaran),
        getEkstrakurikulerRaporSiswa(siswaId, kelas, semester, tahunAjaran),
        getAbsensiRaporByKelas(kelas, semester, tahunAjaran),
      ]);
      const absensi = absensiMap[siswaId] || { sakit: 0, izin: 0, tanpaKeterangan: 0, catatanWali: '', keputusan: 'Belum diputuskan' };

      const semLabel = semester === '2' ? 'Genap' : 'Ganjil';
      const waliNama = session?.nama || '—';

      raporData = { config, siswa, kelas, fase: faseDariKelas(kelas), semLabel, daftarNilai, kokurikuler, ekstrakurikuler, absensi, waliNama };

      $('titleNama').textContent = siswa.nama;
      $('subKelas').textContent = `Kelas ${kelas} · Rapor SAS`;
      $('infoStrip').textContent = `Semester ${semLabel} · Tahun Ajaran ${tahunAjaran}`;
      $('appBody').style.display = 'block';

      $('previewWrap').innerHTML = `<div class="rpr-preview">${buildBodyPrint(raporData)}</div>`;
    } catch (e) {
      console.error(e);
      showEmptyScope('Gagal memuat data rapor. Coba muat ulang halaman.');
    }
  });

  /**
   * Membangun HTML isi rapor (tanpa <html>/@page) — dipakai DUA kali,
   * pola identik rapor-sts-cetak.html (lihat catatan di sana). Isinya
   * di sini JAUH lebih lengkap: nilai + capaian kompetensi naratif per
   * mapel, kokurikuler, ekstrakurikuler, absensi, catatan wali, dan
   * keputusan naik/tinggal kelas — inilah rapor RESMI, bukan bayangan.
   */
  function buildBodyPrint(d) {
    const nilaiRows = d.daftarNilai.map((item, i) => {
      const capaian = [];
      if (item.capaianTerbaik) capaian.push(`<span class="lbl">Sudah baik dalam</span> ${escapeHtml(item.capaianTerbaik)}.`);
      if (item.capaianPerluBimbingan) capaian.push(`<span class="lbl">Perlu bimbingan dalam</span> ${escapeHtml(item.capaianPerluBimbingan)}.`);
      return `
      <tr>
        <td class="td-no">${i + 1}</td>
        <td>${escapeHtml(item.mapel)}</td>
        <td class="td-nilai">${item.nilaiAkhir === null ? '—' : item.nilaiAkhir}</td>
        <td class="capaian-text">${capaian.length ? capaian.join('<br>') : '<span style="color:#999;font-style:italic">Belum ada nilai tercatat.</span>'}</td>
      </tr>`;
    }).join('');

    const kokurikulerRows = d.kokurikuler.length
      ? d.kokurikuler.map((k, i) => `
        <tr>
          <td class="td-no">${i + 1}</td>
          <td>${escapeHtml(k.proyekJudul)}</td>
          <td>${escapeHtml(k.dplNama)}</td>
          <td class="td-predikat">${escapeHtml(DPL_LEVEL_LABEL[k.level - 1] || '—')}</td>
          <td class="capaian-text">${escapeHtml(k.deskripsi) || '<span style="color:#999;font-style:italic">—</span>'}</td>
        </tr>`).join('')
      : `<tr><td colspan="5" style="text-align:center;color:#999;font-style:italic">Belum ada data kokurikuler semester ini.</td></tr>`;

    const ekskulRows = d.ekstrakurikuler.length
      ? d.ekstrakurikuler.map((e, i) => `
        <tr>
          <td class="td-no">${i + 1}</td>
          <td>${escapeHtml(e.nama)}</td>
          <td class="td-predikat">${escapeHtml(EKS_PREDIKAT_LABEL[e.level - 1] || '—')}</td>
          <td class="capaian-text">${escapeHtml(e.deskripsi) || '<span style="color:#999;font-style:italic">—</span>'}</td>
        </tr>`).join('')
      : `<tr><td colspan="4" style="text-align:center;color:#999;font-style:italic">Peserta didik tidak mengikuti kegiatan Ekstrakurikuler semester ini.</td></tr>`;

    const tanda = `${escapeHtml(d.config.kotaRapor || '—')}, ${tanggalIndonesia(new Date())}`;
    const keputusanTeks = d.absensi.keputusan === 'Belum diputuskan'
      ? '<span style="color:#a83a2b">Keputusan belum ditetapkan wali kelas</span>'
      : escapeHtml(d.absensi.keputusan);

    return `
<div class="rpr-title">Laporan Hasil Belajar</div>
<div class="rpr-subtitle">Sumatif Akhir Semester ${d.semLabel}</div>
<div class="rpr-header">
  <div class="rpr-info-grid">
    <div>
      <div class="rpr-info-row"><span class="rpr-info-label">Nama Peserta Didik</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${escapeHtml(d.siswa.nama)}</span></div>
      <div class="rpr-info-row"><span class="rpr-info-label">NISN</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${escapeHtml(d.siswa.nisn || '—')}</span></div>
      <div class="rpr-info-row"><span class="rpr-info-label">Sekolah</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${escapeHtml(d.config.namaSekolah || '—')}</span></div>
      <div class="rpr-info-row"><span class="rpr-info-label">Alamat</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${escapeHtml(d.config.alamatSekolah || '—')}</span></div>
    </div>
    <div>
      <div class="rpr-info-row"><span class="rpr-info-label">Kelas</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${escapeHtml(d.kelas)}</span></div>
      <div class="rpr-info-row"><span class="rpr-info-label">Fase</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${d.fase}</span></div>
      <div class="rpr-info-row"><span class="rpr-info-label">Semester</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${d.semLabel}</span></div>
      <div class="rpr-info-row"><span class="rpr-info-label">Tahun Pelajaran</span><span class="rpr-info-sep">:</span><span class="rpr-info-val">${escapeHtml(d.config.tahunAjaran || '—')}</span></div>
    </div>
  </div>
</div>

<div class="rpr-section-title">A. Nilai Akademik &amp; Capaian Kompetensi</div>
<table>
  <thead><tr><th class="td-no">No.</th><th>Mata Pelajaran</th><th class="td-nilai">Nilai<br>Akhir</th><th>Capaian Kompetensi</th></tr></thead>
  <tbody>${nilaiRows || `<tr><td colspan="4" style="text-align:center;color:#999;font-style:italic">Belum ada mata pelajaran terdaftar untuk tingkatan ini.</td></tr>`}</tbody>
</table>

<div class="rpr-section-title">B. Kokurikuler</div>
<table>
  <thead><tr><th class="td-no">No.</th><th>Proyek</th><th>Dimensi Profil Lulusan</th><th class="td-predikat">Predikat</th><th>Deskripsi</th></tr></thead>
  <tbody>${kokurikulerRows}</tbody>
</table>

<div class="rpr-section-title">C. Ekstrakurikuler</div>
<table>
  <thead><tr><th class="td-no">No.</th><th>Kegiatan</th><th class="td-predikat">Predikat</th><th>Deskripsi</th></tr></thead>
  <tbody>${ekskulRows}</tbody>
</table>

<div class="rpr-section-title">D. Ketidakhadiran</div>
<div class="absensi-grid">
  <div class="absensi-box"><div class="n">${d.absensi.sakit || 0}</div><div class="l">Sakit</div></div>
  <div class="absensi-box"><div class="n">${d.absensi.izin || 0}</div><div class="l">Izin</div></div>
  <div class="absensi-box"><div class="n">${d.absensi.tanpaKeterangan || 0}</div><div class="l">Tanpa Keterangan</div></div>
</div>

<div class="rpr-section-title">E. Catatan Wali Kelas</div>
<div class="catatan-box">${d.absensi.catatanWali ? escapeHtml(d.absensi.catatanWali) : '<span style="color:#999;font-style:italic">Belum ada catatan.</span>'}</div>

<div class="rpr-section-title">F. Keputusan</div>
<div class="keputusan-box">${keputusanTeks}</div>

<div class="rpr-ttd-wrap">
  <div class="rpr-ttd-tanda">${tanda}</div>
  <div class="rpr-ttd">
    <div class="rpr-ttd-col">
      <div>Orang Tua/Wali</div>
      <div class="rpr-ttd-space"></div>
      <div class="rpr-ttd-name">(…………………………)</div>
    </div>
    <div class="rpr-ttd-col">
      <div>Kepala Sekolah,</div>
      <div class="rpr-ttd-space"></div>
      <div class="rpr-ttd-name">${escapeHtml(d.config.namaKepsek || '—')}</div>
      <div class="rpr-ttd-nbm">${d.config.nbmKepsek ? 'NBM. ' + escapeHtml(d.config.nbmKepsek) : ''}</div>
    </div>
    <div class="rpr-ttd-col">
      <div>Wali Kelas,</div>
      <div class="rpr-ttd-space"></div>
      <div class="rpr-ttd-name">${escapeHtml(d.waliNama)}</div>
      <div class="rpr-ttd-nbm"></div>
    </div>
  </div>
</div>`;
  }

  /* ════════════════════════════════════════════════════════════════════
     CETAK PDF — pola identik rapor-sts-cetak.html (lihat catatan di
     sana): jendela baru, @page dengan running footer & nomor halaman,
     page-break-inside:avoid pada baris tabel & blok TTD/keputusan.
     ════════════════════════════════════════════════════════════════════ */
  function cetakPDF() {
    if (!raporData) return;
    const d = raporData;
    const body = buildBodyPrint(d);

    const printHTML = `<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rapor SAS ${escapeHtml(d.siswa.nama)} — Kelas ${escapeHtml(d.kelas)}</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@page{
  size: A4;
  margin: 1.5cm;
  @bottom-left{
    content: "Kelas ${escapeHtml(d.kelas)} | ${escapeHtml(d.siswa.nama)} | ${escapeHtml(d.siswa.nisn || '—')}";
    font-family: Arial, sans-serif; font-size: 9pt; color: #888;
    border-top: 1px solid #ccc; vertical-align: top; padding-top: 2pt;
  }
  @bottom-right{
    content: "Halaman " counter(page) " dari " counter(pages);
    font-family: Arial, sans-serif; font-size: 9pt; color: #888;
    border-top: 1px solid #ccc; vertical-align: top; padding-top: 2pt;
  }
}
body{font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;line-height:1.55;color:#000;background:#fff}
.rpr-title{text-align:center;font-size:14pt;font-weight:bold;text-transform:uppercase;letter-spacing:.4pt;margin-bottom:3pt}
.rpr-subtitle{text-align:center;font-size:11pt;font-weight:bold;margin-bottom:10pt}
.rpr-header{border-bottom:3pt double #000;padding-bottom:9pt;margin-bottom:12pt}
.rpr-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1pt 38pt}
.rpr-info-row{display:flex;font-size:10pt}
.rpr-info-label{width:105pt;flex-shrink:0;font-weight:bold}
.rpr-info-sep{width:7pt;flex-shrink:0;margin-right:2pt}
.rpr-info-val{flex:1}
.rpr-section-title{font-size:10.5pt;font-weight:bold;text-transform:uppercase;letter-spacing:.3pt;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1.3pt solid #000;page-break-after:avoid;break-after:avoid}
table{width:100%;border-collapse:collapse;font-size:9.7pt;margin-bottom:4pt}
th{border:1pt solid #000;padding:5pt 7pt;background:#e0e0e0;font-weight:bold;text-align:center;font-size:9.3pt}
td{border:1pt solid #000;padding:5pt 7pt;vertical-align:top}
.td-no{text-align:center;width:24pt;color:#444}
.td-nilai{text-align:center;width:44pt}
.td-predikat{text-align:center;width:60pt}
.capaian-text{font-size:9pt;line-height:1.5;color:#222}
.capaian-text .lbl{font-weight:bold}
.absensi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10pt;margin-bottom:10pt}
.absensi-box{border:1pt solid #000;border-radius:4pt;text-align:center;padding:9pt 6pt}
.absensi-box .n{font-size:16pt;font-weight:bold}

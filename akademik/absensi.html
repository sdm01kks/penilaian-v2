<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi &amp; Keputusan — Akademik &amp; Rapor | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  .info-strip{font-size:11.5px;color:var(--ink-muted);font-weight:600;margin-bottom:14px}

  .empty-scope{padding:60px 24px;text-align:center}
  .empty-scope svg{width:40px;height:40px;color:var(--ink-muted);margin-bottom:12px}
  .empty-scope p{font-size:13px;color:var(--ink-muted);line-height:1.6}

  .siswa-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .siswa-card-head{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
  .siswa-avatar{width:34px;height:34px;border-radius:50%;background:var(--green-pale);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0}
  .siswa-head-body{flex:1;min-width:0}
  .siswa-head-nama{font-size:13px;font-weight:700;color:var(--ink)}
  .siswa-head-meta{font-size:10.5px;color:var(--ink-muted);margin-top:2px;display:flex;gap:6px;align-items:center}
  .keputusan-pill{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px}
  .kp-belum{background:#eceae6;color:var(--ink-muted)}
  .kp-naik{background:var(--green-pale);color:var(--green-dark)}
  .kp-tinggal{background:#fbe4e0;color:#a83a2b}

  .siswa-card-body{display:none;padding:0 14px 16px}
  .siswa-card.open .siswa-card-body{display:block}
  .siswa-card.open .chevron{transform:rotate(180deg)}

  .absensi-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .absensi-field label{display:block;font-size:10px;font-weight:800;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;text-align:center}
  .absensi-field input{width:100%;text-align:center;padding:9px 4px;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);outline:none}
  .absensi-field input:focus{border-color:var(--green-light)}

  .field-label-sm{font-size:11px;font-weight:700;color:var(--ink-mid);margin:0 0 6px 2px}
  .keputusan-toggle{display:flex;gap:6px;margin-bottom:12px}
  .keputusan-toggle button{
    flex:1;padding:9px 4px;border-radius:11px;border:1.5px solid var(--border);
    background:var(--surface);font-family:inherit;font-size:11px;font-weight:700;color:var(--ink-mid);cursor:pointer;
  }
  .keputusan-toggle button.active-naik{background:var(--green-dark);border-color:var(--green-dark);color:#fff}
  .keputusan-toggle button.active-tinggal{background:#c0392b;border-color:#c0392b;color:#fff}
  .keputusan-toggle button.active-belum{background:#8a8578;border-color:#8a8578;color:#fff}

  .btn-simpan-siswa{width:100%;margin-top:2px;padding:10px;font-size:12.5px}
</style>
</head>
<body>

<div class="phone-viewport">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title">Absensi &amp; Keputusan</div>
            <div class="app-header-sub" id="subKelas">Memuat…</div>
          </div>
        </div>
      </div>

      <div class="app-body" id="appBody" style="display:none">
        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data tersimpan sementara di perangkat ini.</span>
        </div>
        <div class="info-strip" id="infoStrip"></div>
        <div id="siswaList"></div>
      </div>

      <div id="emptyScope" class="empty-scope hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <p id="emptyScopeMsg">Memuat…</p>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg class="dot-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange } from '../assets/firebase.js';
  import {
    tingkatanDariKelas, getSiswaByKelas, getConfigAkademik,
    getAbsensiRaporByKelas, saveAbsensiRapor, KEPUTUSAN_OPSI,
  } from '../assets/firestore-data-akademik.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const kelas = params.get('kelas') || '';
  const tingkatan = tingkatanDariKelas(kelas);

  let session = null;
  let config = null, siswaList = [], absensiMap = {};

  function showToast(msg, isError = false) {
    $('toastMsg').textContent = msg;
    const t = $('toast');
    t.classList.toggle('error', isError);
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function showEmptyScope(msg) {
    $('emptyScopeMsg').textContent = msg;
    $('emptyScope').classList.remove('hidden');
  }
  function initials(nama) {
    return (nama || '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }
  function kpClass(kep) {
    if (kep === 'Naik Kelas') return 'kp-naik';
    if (kep === 'Tinggal Kelas') return 'kp-tinggal';
    return 'kp-belum';
  }

  onAuthChange(async (s) => {
    if (!s) { window.location.href = 'login.html'; return; }
    session = s;

    if (!kelas) { showEmptyScope('Tautan tidak lengkap — kelas tidak diketahui.'); return; }
    const berhak = s.role === 'admin' || (s.waliKelas || []).includes(kelas);
    if (!berhak) {
      showEmptyScope(`Anda bukan wali kelas ${kelas}. Halaman ini khusus wali kelas — guru mata pelajaran biasa tidak memiliki akses, sama seperti aturan di aplikasi sebelumnya.`);
      return;
    }

    $('subKelas').textContent = `Kelas ${kelas}`;
    if (DEMO_MODE) $('demoStrip').classList.remove('hidden');
    $('appBody').style.display = 'block';

    try {
      config = await getConfigAkademik();
      siswaList = await getSiswaByKelas(kelas);
      $('infoStrip').textContent = `Semester ${config.semesterAktif} · Tahun Ajaran ${config.tahunAjaran} · ${siswaList.length} siswa`;
      if (!siswaList.length) showToast('Belum ada data siswa aktif untuk kelas ini.', true);

      absensiMap = await getAbsensiRaporByKelas(kelas, config.semesterAktif, config.tahunAjaran);
      renderSiswaList();
    } catch (e) {
      console.error(e);
      showToast('Gagal memuat data.', true);
    }
  });

  function renderSiswaList() {
    $('siswaList').innerHTML = siswaList.map((sw, i) => {
      const rec = absensiMap[sw.id] || {};
      const kep = rec.keputusan || 'Belum diputuskan';
      return `
      <div class="siswa-card" id="swc-${i}">
        <div class="siswa-card-head" onclick="toggleCard(${i})">
          <div class="siswa-avatar">${escapeHtml(initials(sw.nama))}</div>
          <div class="siswa-head-body">
            <div class="siswa-head-nama">${escapeHtml(sw.nama)}</div>
            <div class="siswa-head-meta">
              <span>${escapeHtml(sw.nis || '')}</span>
              <span class="keputusan-pill ${kpClass(kep)}">${escapeHtml(kep)}</span>
            </div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition:transform .2s;flex-shrink:0"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="siswa-card-body">
          <div class="field-label-sm">Rekap Absensi Semester Ini</div>
          <div class="absensi-row3">
            <div class="absensi-field"><label>Sakit</label><input type="number" min="0" id="sakit-${sw.id}" value="${rec.sakit ?? 0}"></div>
            <div class="absensi-field"><label>Izin</label><input type="number" min="0" id="izin-${sw.id}" value="${rec.izin ?? 0}"></div>
            <div class="absensi-field"><label>Tanpa Ket.</label><input type="number" min="0" id="tk-${sw.id}" value="${rec.tanpaKeterangan ?? 0}"></div>
          </div>

          <div class="field-label-sm">Catatan Wali Kelas (opsional)</div>
          <textarea class="field-textarea" id="catatan-${sw.id}" style="min-height:56px;margin-bottom:12px" placeholder="Catatan perkembangan, sikap, dsb.">${escapeHtml(rec.catatanWali || '')}</textarea>

          <div class="field-label-sm">Keputusan Naik Kelas</div>
          <div class="keputusan-toggle" id="kepToggle-${sw.id}">
            ${KEPUTUSAN_OPSI.map(opt => `
              <button type="button" data-val="${opt}" class="${opt === kep ? (opt === 'Naik Kelas' ? 'active-naik' : opt === 'Tinggal Kelas' ? 'active-tinggal' : 'active-belum') : ''}"
                onclick="pilihKeputusan('${sw.id}','${opt}')">${opt === 'Belum diputuskan' ? 'Belum' : opt}</button>
            `).join('')}
          </div>

          <button class="btn btn-primary-light btn-simpan-siswa" onclick="simpanSiswa('${sw.id}')">Simpan</button>
        </div>
      </div>`;
    }).join('');
  }

  window.toggleCard = (i) => $('swc-' + i)?.classList.toggle('open');

  window.pilihKeputusan = (siswaId, val) => {
    const wrap = $('kepToggle-' + siswaId);
    wrap.dataset.selected = val;
    [...wrap.querySelectorAll('button')].forEach(btn => {
      btn.className = btn.dataset.val === val
        ? (val === 'Naik Kelas' ? 'active-naik' : val === 'Tinggal Kelas' ? 'active-tinggal' : 'active-belum')
        : '';
    });
  };

  window.simpanSiswa = async (siswaId) => {
    const existing = absensiMap[siswaId];
    const wrap = $('kepToggle-' + siswaId);
    const keputusan = wrap.dataset.selected || (existing && existing.keputusan) || 'Belum diputuskan';

    const payload = {
      siswaId, kelas, tingkatan,
      semester: config.semesterAktif, tahunAjaran: config.tahunAjaran,
      sakit: parseInt($('sakit-' + siswaId).value, 10) || 0,
      izin: parseInt($('izin-' + siswaId).value, 10) || 0,
      tanpaKeterangan: parseInt($('tk-' + siswaId).value, 10) || 0,
      catatanWali: $('catatan-' + siswaId).value.trim(),
      keputusan,
    };

    try {
      await saveAbsensiRapor(payload, existing ? existing.id : null);
      showToast('Tersimpan.');
      absensiMap = await getAbsensiRaporByKelas(kelas, config.semesterAktif, config.tahunAjaran);
      renderSiswaList();
      const idx = siswaList.findIndex(s => s.id === siswaId);
      $('swc-' + idx)?.classList.add('open');
    } catch (e) {
      console.error(e);
      showToast('Gagal menyimpan.', true);
    }
  };

  $('btnBack').addEventListener('click', () => {
    window.location.href = session?.role === 'admin' ? 'beranda.html' : 'absensi-hub.html';
  });
</script>
</body>
</html>

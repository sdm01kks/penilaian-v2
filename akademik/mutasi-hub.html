<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutasi Siswa — Akademik &amp; Rapor | SD Muhammadiyah 01 Kukusan</title>
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:#000}
  .demo-strip{
    background:var(--gold-light);border:1px solid rgba(201,136,42,.28);color:#7a5416;
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:11px;margin-bottom:14px;
    display:flex;align-items:center;gap:7px;line-height:1.5;
  }
  .demo-strip svg{flex-shrink:0;width:14px;height:14px}
  .intro-text{font-size:12px;color:var(--ink-muted);line-height:1.6;margin-bottom:16px}

  .task-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;text-decoration:none;display:block}
  .task-top{display:flex;align-items:center;gap:10px}
  .task-badge{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;background:var(--green-pale);color:var(--green-dark)}
  .task-title{font-size:13px;font-weight:800;color:var(--ink)}
  .task-sub{font-size:10.5px;color:var(--ink-muted);margin-top:1px}
  .status-link{font-size:10.5px;font-weight:800;color:var(--blue)}

  .empty-state-small{text-align:center;padding:24px 12px;color:var(--ink-muted);font-size:12.5px}
</style>
</head>
<body>

<div class="phone-viewport">
  <div class="phone-shell">
    <div style="display:flex;flex-direction:column;height:100%;min-height:844px">

      <div class="app-header">
        <div class="app-header-row">
          <button class="app-header-back" id="btnBack" aria-label="Kembali">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="app-header-title-wrap">
            <div class="app-header-title">Mutasi Siswa</div>
            <div class="app-header-sub">Pilih kelas</div>
          </div>
        </div>
      </div>

      <div class="app-body" id="appBody" style="display:none">
        <div id="demoStrip" class="demo-strip hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span>Mode pratinjau — data disimulasikan di perangkat ini.</span>
        </div>
        <p class="intro-text">Usulkan siswa baru masuk kelas Anda, atau siswa yang sudah pindah/keluar. Admin akan menyetujui sebelum data siswa benar-benar berubah.</p>
        <div id="taskList"></div>
        <div id="emptyState" class="task-card hidden">
          <div class="empty-state-small" id="emptyStateMsg"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { DEMO_MODE, onAuthChange } from '../assets/firebase.js';
  const $ = (id) => document.getElementById(id);
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  onAuthChange(async (session) => {
    if (!session) { window.location.href = 'login.html'; return; }
    if (DEMO_MODE) $('demoStrip').classList.remove('hidden');
    $('appBody').style.display = 'block';

    const waliKelas = Array.isArray(session.waliKelas) ? session.waliKelas : [];
    if (!waliKelas.length) {
      $('emptyStateMsg').textContent = session.role === 'admin'
        ? 'Admin bukan wali kelas. Fitur ini untuk wali kelas mengusulkan mutasi ke admin.'
        : 'Anda bukan wali kelas manapun saat ini.';
      $('emptyState').classList.remove('hidden');
      return;
    }

    $('taskList').innerHTML = waliKelas.map((kelas) => `
      <a class="task-card" href="mutasi.html?kelas=${encodeURIComponent(kelas)}">
        <div class="task-top">
          <div class="task-badge">${escapeHtml(kelas)}</div>
          <div style="flex:1"><div class="task-title">Kelas ${escapeHtml(kelas)}</div><div class="task-sub">Usulkan mutasi masuk/keluar</div></div>
          <span class="status-link">Buka →</span>
        </div>
      </a>`).join('');
  });

  $('btnBack').addEventListener('click', () => { window.location.href = 'wali-hub.html'; });
</script>
</body>
</html>
